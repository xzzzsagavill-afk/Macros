plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.chatbinds'

base {
    archivesName = 'chatbinds'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

neoForge {
    // Версию NeoForge можно поменять на любую 21.1.x
    version = '21.1.172'

    runs {
        client {
            client()
        }
    }

    mods {
        chatbinds {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
